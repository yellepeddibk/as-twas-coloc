name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── NOTE: CI must NOT download GTEx data, PredictDB models,
      # or run real MetaXcan / R / coloc. All tests use mock mode only. ──

      - name: Run tests (mock mode only)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: "Smoke test: run_pipeline.py --mock"
        run: |
          python scripts/run_pipeline.py --mock --base-dir /tmp/pipeline_smoke_test

      - name: "Guardrail: validator scripts respond to --help"
        run: |
          python scripts/validate_publication_counts.py --help
          python scripts/check_real_analysis_prereqs.py --help

      - name: "Guardrail: real-analysis prereq report writes valid TSV (synthetic env)"
        run: |
          mkdir -p /tmp/prereq_check
          python scripts/check_real_analysis_prereqs.py \
            --config config/as.yaml \
            --base-dir . \
            --skip-r-package-check \
            --report-tsv /tmp/prereq_check/real_analysis_prereqs.tsv || true
          test -s /tmp/prereq_check/real_analysis_prereqs.tsv
          head -n 1 /tmp/prereq_check/real_analysis_prereqs.tsv | \
            grep -q "category	name	target	ok	required	detail"
